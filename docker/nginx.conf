# ─────────────────────────────────────────────────────────────────────
# KaorCount — servidor do bundle web (Expo export) + proxy reverso
# ─────────────────────────────────────────────────────────────────────

upstream kaorcount_api {
    server api:8000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compressão dos assets estáticos (o mime type é detectado pelo nginx).
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    # ---------- Proxy reverso para a API FastAPI ----------
    # Permite rodar tudo em uma única porta (ex.: http://localhost:8080).
    location /api/ {
        proxy_pass         http://kaorcount_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Documentação interativa da API e health check.
    location ~ ^/(docs|redoc|openapi\.json|health)$ {
        proxy_pass         http://kaorcount_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ---------- Assets com hash no nome (cache longo) ----------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---------- App de página única (React Native Web) ----------
    # Qualquer rota desconhecida devolve o index.html para o roteamento do app.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
