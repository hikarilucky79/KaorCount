name: Vercel API health check

on:
  repository_dispatch:
    types:
      - vercel.deployment.ready

permissions:
  actions: read
  contents: read
  statuses: write

concurrency:
  group: vercel-api-health-${{ github.event.client_payload.id }}
  cancel-in-progress: false

jobs:
  api-health:
    name: API Health (Production)
    if: github.event.client_payload.project.name == 'kaorcount-api' && github.event.client_payload.environment == 'production'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report check status to Vercel
        uses: vercel/repository-dispatch/actions/status@v1
        with:
          name: Vercel / KaorCount API health (production)

      - name: Check the deployment health endpoint
        env:
          DEPLOYMENT_URL: ${{ github.event.client_payload.url }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          from urllib.parse import urlsplit
          from urllib.request import Request, urlopen

          base_url = os.environ.get("DEPLOYMENT_URL", "").rstrip("/")
          parsed = urlsplit(base_url)
          if parsed.scheme != "https" or not parsed.hostname or not parsed.hostname.endswith(".vercel.app"):
              raise SystemExit("Deployment URL is not a Vercel HTTPS URL")

          health_url = f"{base_url}/health"
          for attempt in range(12):
              try:
                  request = Request(health_url, headers={"User-Agent": "KaorCount-deploy-check"})
                  with urlopen(request, timeout=10) as response:
                      body = json.loads(response.read())
                      if response.status == 200 and body.get("status") == "ok":
                          print(f"API health check passed: {health_url}")
                          break
                      raise RuntimeError(f"unexpected health response: HTTP {response.status}, {body!r}")
              except Exception as error:
                  if attempt == 11:
                      raise SystemExit(f"API health check failed: {error}")
                  print(f"Attempt {attempt + 1}/12 failed; retrying: {error}")
                  time.sleep(5)
          PY
